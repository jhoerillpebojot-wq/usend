<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UNSENT</title>
<meta name="theme-color" content="#0B0B0F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="UNSENT">
<link rel="manifest" id="manifest-link" href="">
<link rel="apple-touch-icon" id="apple-icon" href="">
<link rel="icon" id="fav-icon" href="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg:#0B0B0F; --bg1:#151519; --bg2:#1C1C22; --bg3:#26262D; --line:#2B2B33;
  --ink:#EDEDF2; --ink1:#B6B6C3; --ink2:#80808F; --violet:#9C8FE0; --glow:rgba(156,143,224,.16);
  --sage:#8FAE96; --clay:#CE9A73; --rose:#C98A9A;
  --serif:'Fraunces',Georgia,serif; --sans:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  --ease:cubic-bezier(.22,.61,.36,1);
}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#F6F4F1; --bg1:#FFFFFF; --bg2:#FBFAF8; --bg3:#EFEDE9; --line:#E2DFD9;
  --ink:#232026; --ink1:#5B5763; --ink2:#8B8794; --violet:#6E5FBE; --glow:rgba(110,95,190,.12);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.55;min-height:100vh;-webkit-font-smoothing:antialiased;
  padding-top:env(safe-area-inset-top,0px);overflow-x:hidden;transition:background .35s var(--ease),color .35s var(--ease)}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(520px 280px at 85% -4%,var(--glow),transparent 70%),radial-gradient(420px 260px at -5% 105%,rgba(201,138,154,.07),transparent 70%);pointer-events:none;z-index:0}
h1,h2,h3{font-family:var(--serif);font-weight:500;letter-spacing:-.01em}
p{color:var(--ink1)}
button{font-family:inherit;cursor:pointer;color:inherit;touch-action:manipulation}
:focus-visible{outline:2px solid var(--violet);outline-offset:2px;border-radius:8px}
.hidden{display:none!important}

/* ---------- motion ---------- */
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{transform:scale(.9)}60%{transform:scale(1.05)}100%{transform:scale(1)}}
@keyframes sheet{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
@keyframes zoom{from{opacity:0;transform:scale(.95) translateY(8px)}to{opacity:1;transform:none}}
@keyframes letter{from{opacity:0;transform:translateY(24px) scale(.9);filter:blur(8px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(40px,50px)}}
@keyframes drift2{0%,100%{transform:translate(0,0)}50%{transform:translate(-50px,-30px)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes sealed{0%{transform:scale(1)}35%{transform:scale(.96);box-shadow:0 0 0 0 var(--glow)}100%{transform:scale(.98);opacity:.0;box-shadow:0 0 0 24px transparent}}
@keyframes released{to{opacity:0;transform:translateY(-34px) scale(.97);filter:blur(7px)}}
@keyframes br{0%,100%{transform:scale(.7)}45%,55%{transform:scale(1)}}
@keyframes halo{0%,100%{box-shadow:0 0 30px var(--glow)}50%{box-shadow:0 0 70px var(--violet)}}
.enter>*{animation:up .55s var(--ease) both}
.enter>*:nth-child(2){animation-delay:.05s}.enter>*:nth-child(3){animation-delay:.1s}
.enter>*:nth-child(4){animation-delay:.15s}.enter>*:nth-child(5){animation-delay:.2s}.enter>*:nth-child(6){animation-delay:.25s}
.sv{animation:fade .4s var(--ease) both}
.enter .stag>*,.stag.fresh>*{animation:up .45s var(--ease) both}
.stag>*:nth-child(2){animation-delay:.04s}.stag>*:nth-child(3){animation-delay:.08s}.stag>*:nth-child(4){animation-delay:.12s}.stag>*:nth-child(5){animation-delay:.16s}.stag>*:nth-child(n+6){animation-delay:.2s}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:12px 24px;border-radius:100px;border:1px solid transparent;font-size:15px;font-weight:600;transition:transform .18s var(--ease),opacity .2s,box-shadow .25s,background .2s}
.btn:active{transform:scale(.96)}
.btn-main{background:var(--violet);color:#100D1C;box-shadow:0 6px 22px -8px var(--violet)}
:root[data-theme="light"] .btn-main{color:#fff}
.btn-solid{background:var(--ink);color:var(--bg)}
.btn-ghost{background:none;border-color:var(--line);color:var(--ink1)}
.btn-danger{background:none;border-color:#5a3434;color:#d98080}
.btn-sm{min-height:42px;padding:9px 18px;font-size:14px}
.btn[disabled]{opacity:.45;pointer-events:none}
a.btn{text-decoration:none}
.btn.done{background:var(--sage);color:#10200f;box-shadow:none}
.link{background:none;border:none;color:var(--ink2);font-size:14.5px;text-decoration:underline;text-underline-offset:4px;padding:10px}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{min-height:42px;padding:9px 16px;border-radius:100px;border:1px solid var(--line);background:var(--bg2);color:var(--ink1);font-size:14px;transition:transform .15s var(--ease),background .2s,border-color .2s,color .2s}
.chip:active{transform:scale(.94)}
.chip.on{background:var(--glow);border-color:var(--violet);color:var(--violet);animation:pop .3s var(--ease)}
.seg{display:flex;background:var(--bg1);border:1px solid var(--line);border-radius:100px;padding:4px;margin-bottom:24px;width:fit-content;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg.flat{margin:0}
.seg button{background:none;border:none;min-height:40px;padding:8px 18px;border-radius:100px;font-size:14px;font-weight:500;color:var(--ink2);white-space:nowrap;transition:background .25s var(--ease),color .2s}
.seg button.on{background:var(--bg3);color:var(--ink)}
textarea,input[type=text],input[type=date],input[type=time]{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:14px;color:var(--ink);font:inherit;font-size:16px;padding:14px 16px;resize:vertical;transition:border-color .2s,box-shadow .2s}
textarea:focus,input:focus{border-color:var(--violet);outline:none;box-shadow:0 0 0 4px var(--glow)}
::placeholder{color:var(--ink2);opacity:.7}
label.lb{display:block;font-size:13.5px;color:var(--ink2);margin-bottom:10px}
.field{margin-bottom:20px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:6px;outline:none;margin:14px 0 6px;--p:50%;background:linear-gradient(90deg,var(--violet) var(--p),var(--line) var(--p))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:var(--violet);border:4px solid var(--bg1);box-shadow:0 0 0 1px var(--violet),0 4px 14px -2px var(--violet)}
input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:var(--violet);border:4px solid var(--bg1)}
@media (hover:hover){
  .btn:hover{opacity:.9}.btn-main:hover{box-shadow:0 8px 28px -6px var(--violet)}
  .btn-ghost:hover{border-color:var(--ink2);color:var(--ink)}
  .chip:hover{border-color:var(--ink2);color:var(--ink)}
  .item:hover{border-color:var(--ink2);transform:translateY(-2px)}
  .quick button:hover{border-color:var(--violet);transform:translateY(-2px)}
  .link:hover{color:var(--ink)}
}

/* ---------- layout ---------- */
.page{position:relative;z-index:1;max-width:680px;margin:0 auto;padding:30px 20px calc(120px + env(safe-area-inset-bottom,0px))}
.page h1{font-size:clamp(28px,6vw,36px);margin-bottom:8px;line-height:1.2}
.sub{font-size:15px;color:var(--ink2);margin-bottom:26px}
.card{background:var(--bg1);border:1px solid var(--line);border-radius:20px;padding:24px;transition:transform .25s var(--ease)}
.card+.card,.gap{margin-top:18px}
.card h3{font-size:18.5px;margin-bottom:6px}
.small{font-size:13.5px;color:var(--ink2);line-height:1.6}
.note{font-size:14px;font-style:italic;color:var(--ink2)}
.item{background:var(--bg1);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-top:12px;cursor:pointer;transition:transform .2s var(--ease),border-color .2s}
.item:active{transform:scale(.985)}
.item .meta{font-size:12.5px;color:var(--ink2);margin-bottom:6px;display:flex;justify-content:space-between;gap:10px}
.item .pv{font-size:14.5px;color:var(--ink1);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap}
.empty{text-align:center;color:var(--ink2);padding:40px 12px;font-size:14.5px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.between{display:flex;justify-content:space-between;align-items:center;gap:12px}
.mt{margin-top:20px}
.h2{font-size:18px;margin:34px 0 4px}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:16px 0;border-top:1px solid var(--line)}
.setrow:first-of-type{border-top:none}
.setrow .l{font-size:15px}

/* ---------- nav ---------- */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;background:color-mix(in srgb,var(--bg1) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:none;color:var(--ink2);font-size:11.5px;font-weight:500;padding:8px 2px;border-radius:14px;min-height:54px;transition:color .2s,background .25s}
nav.tabs svg{width:23px;height:23px}
nav.tabs button.on{color:var(--violet)}
nav.tabs button.on svg{animation:pop .4s var(--ease)}
@media (min-width:860px){
  nav.tabs{top:0;right:auto;width:200px;flex-direction:column;justify-content:flex-start;gap:4px;padding:28px 12px;border-top:none;border-right:1px solid var(--line)}
  nav.tabs button{flex:none;flex-direction:row;gap:12px;font-size:14.5px;padding:12px 14px;justify-content:flex-start;min-height:0}
  nav.tabs button.on{background:var(--glow)}
  #app .page{margin-left:max(200px,calc(50% - 340px + 100px));padding-bottom:60px}
  #toasts{bottom:30px!important}
}

/* ---------- welcome / lock ---------- */
.center{position:relative;z-index:1;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px 24px;overflow:hidden}
.center.leaving{animation:fade .4s reverse both}
.orbbg{position:absolute;border-radius:50%;filter:blur(70px);pointer-events:none;z-index:-1}
.o1{width:480px;height:480px;background:radial-gradient(circle,var(--glow),transparent 70%);top:-140px;left:-140px;animation:drift 22s ease-in-out infinite}
.o2{width:420px;height:420px;background:radial-gradient(circle,rgba(201,138,154,.14),transparent 70%);bottom:-140px;right:-120px;animation:drift2 26s ease-in-out infinite}
.mark{font-family:var(--serif);font-size:clamp(54px,13vw,96px);line-height:1;letter-spacing:-.02em}
.mark span{display:inline-block;animation:letter .9s var(--ease) both}
.tag{font-family:var(--serif);font-style:italic;color:var(--ink1);font-size:19px;margin-top:18px;animation:up .9s .6s var(--ease) both}
.acts{display:flex;flex-direction:column;align-items:center;gap:18px;margin-top:38px;width:100%;max-width:360px;animation:up .9s .8s var(--ease) both}
.foot{font-size:12.5px;color:var(--ink2);margin-top:34px;max-width:300px;animation:up .9s 1s var(--ease) both}
.wcard,.nudge{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:linear-gradient(135deg,var(--glow),var(--bg1));border:1px solid var(--line);border-radius:18px;padding:16px 18px}
.wcard b,.nudge b{display:block;font-size:15px;color:var(--ink);font-weight:600}
.wcard span,.nudge p{font-size:13px;color:var(--ink2);line-height:1.5}
.wcard .btn{margin-left:auto;flex-shrink:0}
.nudge{margin-bottom:22px;align-items:flex-start}
.nudge .ic{width:42px;height:42px;border-radius:14px;background:var(--glow);color:var(--violet);display:flex;align-items:center;justify-content:center;flex-shrink:0;animation:bob 2.6s ease-in-out infinite}
.nudge .ic svg{width:22px;height:22px}
.dots{display:flex;gap:16px;justify-content:center;margin:26px 0}
.dots i{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--ink2);transition:all .15s}
.dots i.f{background:var(--violet);border-color:var(--violet);transform:scale(1.15)}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:16px;justify-content:center}
.pad button{width:72px;height:72px;border-radius:50%;background:var(--bg2);border:1px solid var(--line);font:24px var(--serif);transition:transform .12s,background .2s}
.pad button:active{transform:scale(.9);background:var(--bg3)}
.pad button.g{background:none;border:none;color:var(--ink2);font-size:16px}

/* ---------- today ---------- */
.big{font-family:var(--serif);font-size:52px;line-height:1.1;margin:6px 0}
.hint{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink2);margin-top:8px}
.quick{display:grid;gap:12px}
.quick button{text-align:left;background:var(--bg1);border:1px solid var(--line);border-radius:16px;padding:18px 20px;font-size:15.5px;font-weight:500;transition:transform .2s var(--ease),border-color .2s}
.quick button:active{transform:scale(.98)}
.quick button small{display:block;color:var(--ink2);font-size:13.5px;margin-top:3px;font-weight:400}

/* ---------- sort ---------- */
.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media (max-width:640px){.cols{grid-template-columns:1fr}}
.col{background:var(--bg1);border:1px solid var(--line);border-radius:16px;padding:16px;min-height:110px}
.col h4{font-size:13.5px;margin-bottom:12px;font-weight:600}
.col.know h4{color:var(--sage)}.col.think h4{color:var(--clay)}.col.fear h4{color:var(--rose)}
.tile{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:11px 40px 11px 13px;font-size:14px;margin-bottom:10px;position:relative;cursor:pointer;color:var(--ink1);animation:pop .3s var(--ease)}
.tile b{position:absolute;right:0;top:0;bottom:0;width:40px;display:flex;align-items:center;justify-content:center;font-weight:400;font-size:18px;color:var(--ink2)}

/* ---------- pause ---------- */
.ringwrap{position:relative;width:220px;height:220px;margin:22px auto 8px}
.ringwrap svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.rt{fill:none;stroke:var(--line);stroke-width:2.5}
.rp{fill:none;stroke:var(--violet);stroke-width:2.5;stroke-linecap:round;transition:stroke-dashoffset 1s linear}
.orb{position:absolute;left:50%;top:50%;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--violet),#5B4F87);animation:br 8s ease-in-out infinite,halo 8s ease-in-out infinite}
.timer{font-family:var(--serif);font-size:42px;text-align:center}
.sealing{animation:sealed .65s var(--ease) forwards}
.releasing{animation:released .7s var(--ease) forwards}

/* ---------- modal / toast ---------- */
.back{position:fixed;inset:0;background:rgba(6,6,9,.66);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:200;display:flex;align-items:center;justify-content:center;padding:18px;animation:fade .25s both}
.modal{background:var(--bg1);border:1px solid var(--line);border-radius:24px;max-width:520px;width:100%;max-height:88vh;max-height:88dvh;overflow-y:auto;padding:28px;animation:zoom .3s var(--ease) both}
.modal h3{font-size:21px;margin-bottom:12px}
@media (max-width:700px){
  .back{align-items:flex-end;padding:0}
  .modal{border-radius:24px 24px 0 0;padding:26px 22px calc(26px + env(safe-area-inset-bottom,0px));animation:sheet .35s var(--ease) both}
  .page{padding:24px 18px calc(124px + env(safe-area-inset-bottom,0px))}
  .card{padding:22px 20px}
  .seg{width:100%}
  .seg button{flex:1;padding:8px 10px}
  .setrow{flex-direction:column;align-items:stretch;gap:12px}
  .setrow .seg{width:100%}
  .row .btn{flex:1 1 auto}
  .wcard{flex-wrap:wrap}
  .wcard .btn{width:100%;margin-left:0}
}
#toasts{position:fixed;bottom:calc(92px + env(safe-area-inset-bottom,0px));left:0;right:0;z-index:400;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 16px}
.toast{background:var(--ink);color:var(--bg);padding:12px 22px;border-radius:100px;font-size:14px;font-weight:500;box-shadow:0 10px 30px rgba(0,0,0,.3);animation:up .35s var(--ease) both}
.step{display:flex;gap:16px;padding:13px 0;border-top:1px solid var(--line);font-size:15px;color:var(--ink1);line-height:1.5}
.step:first-child{border-top:none}
.step i{font-family:var(--serif);color:var(--violet);min-width:18px;font-style:normal}
#lock{position:fixed;inset:0;z-index:300;background:var(--bg);overflow-y:auto}
.bar{height:8px;border-radius:8px;background:var(--bg3);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--violet);border-radius:8px}
</style>
</head>
<body>

<!-- LOCK -->
<div id="lock" class="center hidden">
  <h2 id="lock-t" style="font-size:27px">Enter your passcode</h2>
  <p class="small" id="lock-s" style="margin-top:8px">Welcome back.</p>
  <div class="dots" id="lock-dots"></div>
  <div class="pad" id="lock-pad"></div>
  <button class="link" id="lock-x" style="margin-top:22px">Cancel</button>
</div>

<!-- WELCOME -->
<div id="welcome" class="center">
  <div class="orbbg o1"></div><div class="orbbg o2"></div>
  <div class="mark" id="mark" aria-label="UNSENT"></div>
  <p class="tag">For the feelings that have nowhere to go.</p>
  <div class="acts">
    <button class="btn btn-solid" id="enter" style="padding:16px 40px;font-size:16.5px;min-width:200px">Enter</button>
    <div class="wcard" id="w-inst">
      <div><b>Install UNSENT</b><span>Opens like an app, even offline.</span></div>
      <button class="btn btn-main btn-sm" id="w-install">Install</button>
    </div>
  </div>
  <p class="foot">Private to this device. Not a replacement for therapy, medical care, or emergency services.</p>
</div>

<!-- APP -->
<div id="app" class="hidden">
  <nav class="tabs" id="tabs" aria-label="Main"></nav>
  <main class="page" id="page"></main>
</div>
<div id="modal-root"></div>
<div id="toasts"></div>

<script>
(function(){
"use strict";
const $=(s,r)=>(r||document).querySelector(s), $$=(s,r)=>Array.from((r||document).querySelectorAll(s));
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const fmt=d=>{const x=new Date(d+"T00:00:00");return isNaN(x)?d:x.toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"})};
const ago=d=>Math.round((new Date(today()+"T00:00:00")-new Date(d+"T00:00:00"))/864e5);
const reduced=()=>matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------- DATA ---------- */
const KEY="unsent2";
const blank=()=>({checkins:[],unsent:[],pauses:[],journal:[],letters:[],theme:null,pin:null,installDismissed:null,sound:true,haptics:true,sort:null,since:today(),lastBackup:null,backupSnooze:null,remind:{on:true,time:"20:00"},fails:0,lockUntil:0});
function load(){
  try{
    const r=localStorage.getItem(KEY);
    if(r) return Object.assign(blank(),JSON.parse(r));
    const o=localStorage.getItem("unsentAppData");
    if(o){
      const p=JSON.parse(o), d=blank();
      d.checkins=(p.checkIns||[]).map(c=>({date:c.date,weight:c.weight,reasons:c.reasons||[]}));
      d.unsent=(p.unsentMessages||[]).map(m=>({id:m.id,date:m.date,to:m.recipient,body:m.body,status:m.status==="released"?"released":"sealed"}));
      d.pauses=(p.pauseSessions||[]).map(m=>({id:m.id,date:m.date,kind:"text",resolved:m.resolved==="kept"?"kept":"done"}));

/* ---------- SOUND ----------
   Soft, synthesized with the Web Audio API. No audio files needed.
   Everything is quiet, rounded (sine waves) and passed through a gentle low-pass + light echo. */
const SFX=(function(){
  let ctx=null,master=null,send=null,lastTick=0,skip=false;

      const fl=ctx.createBiquadFilter();fl.type="lowpass";fl.frequency.value=1800;
      send.connect(dl);dl.connect(fl);fl.connect(fb);fb.connect(dl);fl.connect(lp);
    }

    g.gain.setValueAtTime(.0001,t0);
    g.gain.exponentialRampToValueAtTime(v,t0+d*.35);
    g.gain.exponentialRampToValueAtTime(.0001,t0+d);

    seg:()=>tone(523,{d:.09,v:.04}),
    chipOn:()=>{tone(N.E5,{d:.13,v:.055});tone(988,{d:.1,v:.022,at:.03})},
    chipOff:()=>tone(392,{d:.09,v:.035,to:349}),
    open:()=>{tone(440,{d:.14,v:.04});tone(660,{d:.16,v:.025,at:.05})},
    pop:()=>tone(700,{d:.1,v:.055,to:920}),
    soft:()=>tone(330,{d:.26,v:.045,to:294}),
    save:()=>{tone(N.C5,{d:.3,v:.05});tone(N.E5,{d:.3,v:.05,at:.07});tone(N.G5,{d:.4,v:.05,at:.14})},
    seal:()=>{tone(196,{d:.55,v:.09,to:150});tone(294,{d:.5,v:.04,at:.02});tone(1175,{d:.45,v:.018,at:.09})},
    release:()=>{air(.9,.05,400,2400);tone(N.C5,{d:.7,v:.04});tone(N.G5,{d:.8,v:.035,at:.12});tone(N.C6,{d:.9,v:.025,at:.24})},
    start:()=>{tone(174.6,{d:1.7,v:.07,a:.06});tone(261.6,{d:1.7,v:.035,a:.08,at:.02})},
    in:()=>tone(262,{d:1.6,v:.022,a:.6,to:330}),
    out:()=>tone(330,{d:1.8,v:.022,a:.3,to:247}),
    bell:()=>{tone(N.C5,{d:2.4,v:.06,a:.01});tone(N.G5,{d:2.6,v:.04,a:.01,at:.01});tone(1568,{d:1.6,v:.012,a:.01,at:.02})},
    success:()=>{tone(N.C5,{d:.8,v:.05});tone(N.E5,{d:.8,v:.05,at:.1});tone(N.G5,{d:.9,v:.05,at:.2});tone(N.C6,{d:1.1,v:.045,at:.32})},

    delete:()=>tone(220,{d:.22,v:.055,to:150}),
    back:()=>tone(300,{d:.07,v:.035}),
    error:()=>{tone(233,{d:.2,v:.055});tone(196,{d:.28,v:.055,at:.14})},
    unlock:()=>{tone(N.C5,{d:.5,v:.05});tone(N.G5,{d:.5,v:.05,at:.09});tone(N.C6,{d:.7,v:.045,at:.18})},
    enter:()=>{tone(261.6,{d:1.5,v:.05,a:.18});tone(329.6,{d:1.5,v:.04,a:.2,at:.04});tone(392,{d:1.5,v:.04,a:.22,at:.08});tone(N.C5,{d:1.4,v:.03,a:.2,at:.2})}
  };
  const HAP={tap:6,nav:8,seg:6,chipOn:8,chipOff:5,open:7,pop:8,soft:8,save:[10,40,10],seal:20,release:[10,30,10],start:[15,40,15],bell:[30,80,30],success:[15,50,15,50,25],chime:[8,30,8],delete:18,back:5,key:5,error:[40,60,40],unlock:[10,40,15],enter:12};

const P={stage:"idle",kind:"text",dur:300,rem:0,timer:null,id:null,text:"",endAt:0};
function finishPause(res){const s=D.pauses.find(x=>x.id===P.id);if(s&&s.resolved==="pending"){s.resolved=res;save()}}
function wPause(el){
  const mo=today().slice(0,7), m=D.pauses.filter(p=>p.date.slice(0,7)===mo), kept=m.filter(p=>p.resolved==="kept").length;
  if(P.stage==="idle"){
    el.innerHTML=`
      <div class="card">
        <h3>Feeling the urge?</h3>
        <p class="small" style="margin-bottom:18px">Give it a few minutes before you decide.</p>
        <label class="lb">What do you want to do?</label>
        ${chips(["Text them","Check their profile"],"k",["Text them"])}
        <div class="field mt"><label class="lb">What would you say? (optional. You can seal it as an unsent message after the pause.)</label><textarea id="pt" rows="4" placeholder="Write it exactly as you would send it.">${esc(P.text||"")}</textarea></div>
        <label class="lb">How long to pause?</label>
        <div class="chips">${[["5 min",300],["10 min",600],["30 min",1800]].map(([l,s])=>'<button type="button" class="chip'+(s===P.dur?" on":"")+'" data-d="'+s+'">'+l+'</button>').join("")}</div>
        <button class="btn btn-main mt" id="ps" style="width:100%">Start pause</button>
      </div>
      ${m.length?`<p class="note mt">You paused ${m.length} time${m.length>1?"s":""} this month and chose not to act ${kept} time${kept===1?"":"s"}.</p>`:""}`;
    pick(el,"k",false);pick(el,"d",false);
    $$("[data-d]",el).forEach(b=>b.addEventListener("click",()=>{P.dur=+b.dataset.d}));
    $("#ps").addEventListener("click",()=>{
      sfx("start");
      P.text=($("#pt").value||"").trim();
      P.kind=chosen(el,"k")[0]==="Check their profile"?"check":"text";
      P.rem=P.dur;P.endAt=Date.now()+P.dur*1000;P.stage="timer";P.id=uid();
      D.pauses.push({id:P.id,date:today(),kind:P.kind,resolved:"pending"});save();
      wPause(el);
    });
    return;
  }
  if(P.stage==="timer"){
    const C=2*Math.PI*54;
    el.innerHTML=`<div class="card" style="text-align:center"><p class="note">You don’t have to decide yet.</p>
      <div class="ringwrap"><svg viewBox="0 0 120 120"><circle class="rt" cx="60" cy="60" r="54"/><circle class="rp" id="rp" cx="60" cy="60" r="54" style="stroke-dasharray:${C};stroke-dashoffset:0"/></svg><div class="orb"></div></div>
      <div class="timer" id="tn"></div><p class="small" id="bl" style="margin-top:6px"></p><button class="btn btn-ghost btn-sm mt" id="sk">Skip</button></div>`;
    let lastSec=-1;
    const tick=()=>{
      P.rem=Math.max(0,Math.ceil((P.endAt-Date.now())/1000));
      const mm=Math.floor(P.rem/60),ss=P.rem%60;$("#tn").textContent=mm+":"+String(ss).padStart(2,"0");
      $("#bl").textContent=((P.dur-P.rem)%8)<4?"Breathe in":"Breathe out";
      $("#rp").style.strokeDashoffset=C*(1-P.rem/P.dur);
      if(P.rem<=0){clearInterval(P.timer);P.timer=null;P.stage="decide";SFX.play("bell");wPause(el);return}
      const el_=P.dur-P.rem;
      if(el_!==lastSec){lastSec=el_;if(el_%4===0&&el_>0)SFX.play(el_%8===0?"in":"out")}
    };
    tick();P.timer=setInterval(tick,500);
    $("#sk").addEventListener("click",()=>{clearInterval(P.timer);P.timer=null;P.stage="decide";wPause(el)});
    return;
  }
  if(P.stage==="decide"){
    el.innerHTML=`<div class="card sv" style="text-align:center"><h3>How do you feel now?</h3><p class="small">Whatever you choose, nothing is sent from here.</p>
      ${P.text?`<div style="text-align:left;background:var(--bg2);border-radius:14px;padding:14px 16px;margin-top:16px"><p class="small" style="margin-bottom:6px">What you wrote before the pause:</p><p style="white-space:pre-wrap;color:var(--ink);font-size:14.5px;line-height:1.6">${esc(P.text)}</p></div><button class="btn btn-ghost btn-sm mt" id="pseal">Seal it as an unsent message</button>`:""}
      <div class="row mt" style="justify-content:center"><button class="btn btn-main" id="pk">The urge passed</button><button class="btn btn-ghost" id="pd2">I still want to</button></div></div>`;
    if($("#pseal"))$("#pseal").addEventListener("click",()=>{D.unsent.push({id:uid(),date:today(),to:"Someone else",body:P.text,status:"sealed"});save();sfx("seal");P.text="";toast("Sealed. It stays here.");wPause(el)});
    $("#pk").addEventListener("click",()=>{P.text="";sfx("success");finishPause("kept");P.stage="idle";toast("Noted. That took something.");rerender()});
    $("#pd2").addEventListener("click",()=>{
      sfx("soft");
      P.text="";finishPause("done");P.stage="idle";
      modal('<h3>That’s your call</h3><p style="line-height:1.7">UNSENT can’t send anything for you. If you reach out, that happens outside this space. What you wrote here is only yours.</p><button class="btn btn-solid mt" data-x style="width:100%">Okay</button>');
      rerender();
    });
  }
}

/* ---------- UNDERSTAND ---------- */
const S={know:[],think:[],fear:[],cat:"know"};
function loadSort(){const o=D.sort||{};S.know=(o.know||[]).slice();S.think=(o.think||[]).slice();S.fear=(o.fear||[]).slice()}

function rUnderstand(el){

function uSort(el){
  const names={know:"What I know",think:"What I think",fear:"What I fear"}, order=["know","think","fear"];

    ${total?`<div class="card"><label class="lb">What changed when you separated them?</label><textarea id="sr" rows="3" placeholder="Optional"></textarea><div class="row mt"><button class="btn btn-main btn-sm" id="ss">Save to journal</button><button class="btn btn-ghost btn-sm" id="sc">Clear</button></div></div>`:""}`;
  $$("[data-c]",el).forEach(b=>b.addEventListener("click",()=>{S.cat=b.dataset.c;$$("[data-c]",el).forEach(x=>x.classList.toggle("on",x===b))}));
  const add=()=>{const v=$("#si").value.trim();if(!v)return;sfx("pop");S[S.cat].push(v);keepSort();uSort(el);$("#si").focus()};
  $("#sa").addEventListener("click",add);
  $("#si").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();SFX.play("pop");add()}});
  $$(".tile",el).forEach(t=>t.addEventListener("click",e=>{
    const [c,i]=t.dataset.m.split(":");
    if(e.target.closest("[data-d]")){S[c].splice(+i,1);keepSort();uSort(el);return}

      D.journal.push({id:uid(),date:today(),title:"Facts and fears",body:(part("I know",S.know)+part("I think",S.think)+part("I fear",S.fear)+(r?"What changed: "+r:"")).trim()});
      save();sfx("save");S.know=[];S.think=[];S.fear=[];keepSort();toast("Saved to your journal.");uSort(el);
    });
  }
}

const PROMPTS=["What are you pretending doesn’t hurt?","What do you wish they understood?","What do you know now that you didn’t then?","What part of this is outside your control?","What do you miss?","What don’t you miss?","What boundary became clearer?","What would you tell yourself from a month ago?"];

function jPattern(el){
  const pts=D.checkins.filter(c=>ago(c.date)<=29).sort((a,b)=>a.date.localeCompare(b.date));
  let graph='<div class="empty">Check in a few times from Today and your pattern will show up here.</div>';
  if(pts.length>=2){
    const w=600,h=140,p=10,xs=pts.map((_,i)=>p+i*((w-2*p)/(pts.length-1))),ys=pts.map(c=>h-p-(c.weight/100)*(h-2*p));
    const path=xs.map((x,i)=>(i?"L":"M")+x.toFixed(1)+","+ys[i].toFixed(1)).join(" ");
    graph=`<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="width:100%;height:140px" role="img" aria-label="Emotional weight over the last 30 days"><path d="${path} L${xs[xs.length-1]},${h} L${xs[0]},${h}Z" fill="var(--glow)"/><path d="${path}" fill="none" stroke="var(--violet)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" pathLength="1" style="stroke-dasharray:1;stroke-dashoffset:1;animation:dash 1.4s var(--ease) .1s forwards"/>${xs.map((x,i)=>'<circle cx="'+x.toFixed(1)+'" cy="'+ys[i].toFixed(1)+'" r="2.8" fill="var(--violet)"/>').join("")}</svg><div class="hint"><span>Last 30 days</span><span>Higher means heavier</span></div><style>@keyframes dash{to{stroke-dashoffset:0}}</style>`;
  }
  const recent=D.checkins.filter(c=>ago(c.date)<=29), cnt={};
  recent.forEach(c=>(c.reasons||[]).forEach(r=>{cnt[r]=(cnt[r]||0)+1}));
  const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,4), mx=top.length?top[0][1]:1;
  const avg=f=>{const a=D.checkins.filter(f);return a.length?Math.round(a.reduce((t,c)=>t+c.weight,0)/a.length):null};
  const a1=avg(c=>ago(c.date)<=6), a0=avg(c=>ago(c.date)>=7&&ago(c.date)<=13);
  let wk="";
  if(a1!=null&&a0!=null){const df=a1-a0;wk="This week averaged "+a1+"%, "+(Math.abs(df)<5?"about the same as":(df<0?"lighter than":"heavier than"))+" last week ("+a0+"%).";}
  else if(a1!=null)wk="This week averages "+a1+"%.";
  const insHtml=(wk||top.length)?'<div class="card"><h3>What’s been showing up</h3>'+(wk?'<p style="margin:8px 0 6px;line-height:1.7">'+wk+'</p>':"")+top.map(([r,n])=>'<div style="margin-top:14px"><div class="between" style="font-size:14.5px"><span style="color:var(--ink1)">'+esc(r)+'</span><span class="small">'+n+(n===1?" day":" days")+'</span></div><div class="bar"><i style="width:'+Math.round(n/mx*100)+'%"></i></div></div>').join("")+'<p class="small mt">Patterns, not verdicts. Hard days are part of it.</p></div>':"";
  const st=[["Unsent messages",D.unsent.length],["Times paused",D.pauses.length],["Urges that passed",D.pauses.filter(x=>x.resolved==="kept").length]];
  el.innerHTML=`<div class="card"><h3>Your pattern</h3><p class="small" style="margin-bottom:16px">Not a measure of recovery. Just what you’ve noticed.</p>${graph}</div>
    ${insHtml}<div class="card"><h3>So far</h3>${st.map(([k,v])=>'<div class="between" style="padding:12px 0;border-top:1px solid var(--line);font-size:15px"><span style="color:var(--ink1)">'+k+'</span><span>'+v+"</span></div>").join("")}</div>`;
}

  $("#es",b).addEventListener("click",()=>{
    const nb=$("#eb",b).value.trim();if(!nb){toast("An entry can’t be empty.");return}
    e.title=$("#et",b).value.trim();e.body=nb;save();sfx("save");closeModal();toast("Updated.");rerender();
  });
}
function editLetter(l){
  closeModal();
  const b=modal('<h3>Edit letter</h3><div class="field"><textarea id="eb" rows="8">'+esc(l.body)+'</textarea></div><div class="field"><label class="lb">Unlock on</label><input type="date" id="ed" value="'+esc(l.unlock)+'"></div><div class="row"><button class="btn btn-main" id="es">Save changes</button><button class="btn btn-ghost" data-x>Cancel</button></div>');
  $("#es",b).addEventListener("click",()=>{
    const nb=$("#eb",b).value.trim();if(!nb){toast("A letter can’t be empty.");return}
    l.body=nb;l.unlock=$("#ed",b).value||l.unlock;save();sfx("save");closeModal();toast("Updated.");rerender();
  });
}
function makeIcs(){
  const t=((D.remind&&D.remind.time)||"20:00").split(":"), d=new Date(), p2=n=>String(n).padStart(2,"0");
  const start=d.getFullYear()+p2(d.getMonth()+1)+p2(d.getDate())+"T"+p2(t[0])+p2(t[1])+"00";
  const url=/^https?:/.test(location.href)?location.href.split("#")[0].split("?")[0]:"";
  const ics=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//UNSENT//Check-in//EN","BEGIN:VEVENT","UID:unsent-checkin-"+uid()+"@unsent","DTSTAMP:"+new Date().toISOString().replace(/[-:]/g,"").split(".")[0]+"Z","DTSTART:"+start,"DURATION:PT10M","RRULE:FREQ=DAILY","SUMMARY:UNSENT check-in","DESCRIPTION:Take a quiet minute to check in with yourself."+(url?" "+url:""),"BEGIN:VALARM","TRIGGER:PT0S","ACTION:DISPLAY","DESCRIPTION:UNSENT check-in","END:VALARM","END:VEVENT","END:VCALENDAR"].join("\r\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([ics],{type:"text/calendar"}));
  a.download="unsent-daily-checkin.ics";document.body.appendChild(a);a.click();a.remove();
  toast("Open the file to add it to your calendar.");
}

/* ---------- LOCK ---------- */
async function sha(s){
  if(window.crypto&&crypto.subtle){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,"0")).join("")}
  return "f"+s.split("").reduce((h,c)=>(h<<5)-h+c.charCodeAt(0)|0,0);
}
async function hashPin(pin,salt){
  if(!(window.crypto&&crypto.subtle))return null;
  const k=await crypto.subtle.importKey("raw",new TextEncoder().encode(pin),"PBKDF2",false,["deriveBits"]);
  const b=await crypto.subtle.deriveBits({name:"PBKDF2",salt:new TextEncoder().encode(salt),iterations:150000,hash:"SHA-256"},k,256);
  return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,"0")).join("");
}
async function makePin(pin){const salt=uid()+uid();const h=await hashPin(pin,salt);return h?"p2:"+salt+":"+h:await sha(pin)}
async function checkPin(pin){
  if(!D.pin)return false;
  if(D.pin.indexOf("p2:")===0){const parts=D.pin.split(":");return (await hashPin(pin,parts[1]))===parts[2]}
  const ok=(await sha(pin))===D.pin;
  if(ok){D.pin=await makePin(pin);save()}   // quietly upgrade an older, unsalted passcode
  return ok;
}
let L={mode:"enter",buf:"",first:null,ok:null,busy:false,relock:false};
function lockOpen(mode,ok,relock){L={mode,buf:"",first:null,ok,busy:false,relock:!!relock};$("#lock").classList.remove("hidden");$("#lock-x").classList.toggle("hidden",!!relock);lockDraw()}
function lockDraw(){
  const t={enter:["Enter your passcode","Welcome back."],setup:["Choose a passcode","4 digits. Something only you know."],confirm:["Confirm your passcode","Enter it once more."]}[L.mode];
  $("#lock-t").textContent=t[0];$("#lock-s").textContent=t[1];
  const wait=Math.ceil(((D.lockUntil||0)-Date.now())/1000);
  if(L.mode==="enter"&&wait>0)$("#lock-s").textContent="Too many tries. Try again in "+(wait>=60?Math.ceil(wait/60)+" min":wait+"s")+".";
  $("#lock-dots").innerHTML=[0,1,2,3].map(i=>'<i class="'+(i<L.buf.length?"f":"")+'"></i>').join("");
  $("#lock-pad").innerHTML=["1","2","3","4","5","6","7","8","9","","0","⌫"].map(k=>k===""?"<div></div>":'<button type="button" class="'+(k==="⌫"?"g":"")+'" data-k="'+k+'">'+k+"</button>").join("");
  $$("#lock-pad [data-k]").forEach(b=>b.addEventListener("click",()=>lockKey(b.dataset.k)));
}
async function lockKey(k){
  if(L.busy)return;
  if(k==="⌫"){SFX.play("back");L.buf=L.buf.slice(0,-1);lockDraw();return}
  if(L.mode==="enter"&&(D.lockUntil||0)>Date.now()){SFX.play("error");lockDraw();return}
  if(L.buf.length>=4)return;SFX.key(k);L.buf+=k;lockDraw();if(L.buf.length<4)return;
  const bad=()=>{SFX.play("error");L.busy=true;$("#lock-s").textContent="That didn’t match. Try again.";setTimeout(()=>{L.buf="";L.busy=false;lockDraw();if(!((D.lockUntil||0)>Date.now()))$("#lock-s").textContent="Try again."},450)};
  if(L.mode==="enter"){if(await checkPin(L.buf)){D.fails=0;D.lockUntil=0;save();SFX.play("unlock");$("#lock").classList.add("hidden");L.ok&&L.ok()}else{D.fails=(D.fails||0)+1;if(D.fails%5===0)D.lockUntil=Date.now()+Math.min(15,Math.pow(2,D.fails/5-1)/2)*60000;save();bad()}}
  else if(L.mode==="setup"){L.first=L.buf;L.buf="";L.mode="confirm";lockDraw()}
  else{ if(L.buf===L.first){D.pin=await makePin(L.buf);D.fails=0;D.lockUntil=0;save();SFX.play("unlock");$("#lock").classList.add("hidden");toast("Passcode set.");L.ok&&L.ok()}else{L.mode="setup";L.first=null;bad()} }
}
$("#lock-x").addEventListener("click",()=>{
  $("#lock").classList.add("hidden");
  if(L.mode==="enter")$("#welcome").classList.remove("hidden");
});
