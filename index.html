function buildSvgGraph(){
  const pts = data.checkIns.filter(c=>daysAgo(c.date)<=timelineRange).slice().sort((a,b)=>a.date.localeCompare(b.date));
  if(pts.length<2){
    return `<div class="empty-state" style="padding:30px 10px;"><div class="es-sub">Once you have a few check-ins, your pattern will show up here.</div></div>`;
  }
  const w=600,h=140,pad=10;
  const xs = pts.map((p,i)=> pad + i*((w-2*pad)/(pts.length-1)));
  const ys = pts.map(p=> h-pad - (p.weight/100)*(h-2*pad));
  const path = xs.map((x,i)=>`${i===0?'M':'L'}${x.toFixed(1)},${ys[i].toFixed(1)}`).join(' ');
  const areaPath = path + ` L${xs[xs.length-1].toFixed(1)},${h} L${xs[0].toFixed(1)},${h} Z`;
  return `<svg class="tl-graph" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <path d="${areaPath}" fill="var(--violet-glow)" stroke="none"/>
    <path d="${path}" fill="none" stroke="var(--violet)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    ${xs.map((x,i)=>`<circle cx="${x.toFixed(1)}" cy="${ys[i].toFixed(1)}" r="2.6" fill="var(--violet)"/>`).join('')}
  </svg>`;
}
function buildHeatmap(){
  const days = Math.min(timelineRange, 182);
  const byDate = {};
  data.checkIns.forEach(c=>{ byDate[c.date]=c.weight; });
  const cells = [];
  const start = new Date(todayStr()+'T00:00:00');
  start.setDate(start.getDate() - (days-1));
  // align to start of week (Sun)
  const lead = start.getDay();
  for(let i=0;i<lead;i++) cells.push(null);
  for(let i=0;i<days;i++){
    const d = new Date(start); d.setDate(start.getDate()+i);
    const ds = d.toISOString().slice(0,10);
    cells.push({date:ds, weight: byDate[ds]});
  }
  function colorFor(w){
    if(w==null) return 'var(--bg-3)';
    if(w<20) return 'rgba(143,174,150,0.85)';
    if(w<40) return 'rgba(143,174,150,0.45)';
    if(w<60) return 'rgba(206,154,115,0.5)';
    if(w<80) return 'rgba(201,138,154,0.55)';
    return 'rgba(201,138,154,0.9)';
  }
  const cellsHtml = cells.map(c=>{
    if(!c) return `<div class="heatmap-cell" style="background:transparent;"></div>`;
    const title = c.weight!=null ? `${fmtDate(c.date)} — ${c.weight}%` : fmtDate(c.date);
    return `<div class="heatmap-cell" style="background:${colorFor(c.weight)};" title="${escapeAttr(title)}"></div>`;
  }).join('');
  return `<div class="heatmap-wrap"><div class="heatmap-grid">${cellsHtml}</div></div>
  <div class="heatmap-legend"><span>Lighter</span>${[10,30,50,70,90].map(w=>`<div class="heatmap-cell" style="background:${colorFor(w)};"></div>`).join('')}<span>Heavier</span><span style="margin-left:8px;">· no entry</span><div class="heatmap-cell" style="background:var(--bg-3);"></div></div>`;
}

  el.innerHTML = `

      <div class="receipt" id="receipt-render">
        <div class="receipt-title">EMOTIONAL RECEIPT</div>
        ${Object.entries(stats).map(([k,v])=>`<div class="receipt-row"><span>${k}</span><span>${v}</span></div>`).join('')}
        <div class="receipt-total"><span>REFUND</span><span>Not available</span></div>
        <div class="receipt-row" style="border:none;"><span>LESSON</span><span>Still processing</span></div>
      </div>
      <div class="chip-row" style="justify-content:center; margin-top:20px;">

      </div>
    </div>
  `;
  document.getElementById('receipt-copy').addEventListener('click', async ()=>{
    const text = 'EMOTIONAL RECEIPT\n'+Object.entries(stats).map(([k,v])=>`${k}: ${v}`).join('\n')+'\nREFUND: Not available\nLESSON: Still processing';
    try{ await navigator.clipboard.writeText(text); toast('Copied.'); }catch(e){ toast('Could not copy — select the text manually.'); }
  });
  document.getElementById('receipt-download').addEventListener('click', ()=>downloadReceiptImage(stats));
}
function downloadReceiptImage(stats){
  const isLight = data.settings.theme==='light';
  const bg = isLight ? '#FFFFFF' : '#151519';
  const line = isLight ? '#E4E1DB' : '#2B2B33';
  const ink0 = isLight ? '#232026' : '#EDEDF2';
  const ink1 = isLight ? '#5B5763' : '#B6B6C3';
  const w=440, rowH=30, padTop=70, padBottom=90;
  const rows = Object.entries(stats);
  const h = padTop + rows.length*rowH + padBottom;
  const canvas = document.createElement('canvas');
  const scale = 2;
  canvas.width = w*scale; canvas.height = h*scale;
  const ctx = canvas.getContext('2d');
  ctx.scale(scale,scale);
  ctx.fillStyle = bg; ctx.fillRect(0,0,w,h);
  ctx.strokeStyle = line; ctx.setLineDash([4,3]); ctx.lineWidth=1.5;
  ctx.strokeRect(10,10,w-20,h-20);
  ctx.setLineDash([]);
  ctx.fillStyle = ink0; ctx.textAlign='center'; ctx.font='600 17px Georgia, serif';
  ctx.fillText('EMOTIONAL RECEIPT', w/2, 44);
  ctx.textAlign='left'; ctx.font='13px "Courier New", monospace';
  let y = padTop;
  rows.forEach(([k,v])=>{
    ctx.fillStyle = ink1; ctx.fillText(k, 30, y);
    ctx.fillStyle = ink0; ctx.textAlign='right'; ctx.fillText(String(v), w-30, y);
    ctx.textAlign='left';
    ctx.strokeStyle = line; ctx.beginPath(); ctx.setLineDash([1,2]);
    ctx.moveTo(30,y+8); ctx.lineTo(w-30,y+8); ctx.stroke(); ctx.setLineDash([]);
    y += rowH;
  });
  y += 4;
  ctx.strokeStyle = ink0; ctx.setLineDash([4,3]); ctx.beginPath(); ctx.moveTo(30,y); ctx.lineTo(w-30,y); ctx.stroke(); ctx.setLineDash([]);
  y += 22;
  ctx.font='700 13px "Courier New", monospace'; ctx.fillStyle = ink0;
  ctx.fillText('REFUND', 30, y); ctx.textAlign='right'; ctx.fillText('Not available', w-30, y); ctx.textAlign='left';
  y += 24;
  ctx.font='13px "Courier New", monospace'; ctx.fillStyle = ink1;
  ctx.fillText('LESSON', 30, y); ctx.textAlign='right'; ctx.fillText('Still processing', w-30, y);
  const url = canvas.toDataURL('image/png');
  const a = document.createElement('a'); a.href=url; a.download='unsent-emotional-receipt.png'; document.body.appendChild(a); a.click(); a.remove();
  toast('Downloaded.');
}

          ${[['off','Off'],['on','On']].map(([v,l])=>`<button class="segbtn ${((v==='on')===hasPin)?'active':''}" data-pin="${v}">${l}</button>`).join('')}
        </div>
      </div>
      ${hasPin ? `<div class="settings-row"><div><div class="settings-row-label">Change passcode</div></div><button class="btn btn-ghost btn-sm" id="pin-change">Change</button></div>`:''}
    </div>

    <div class="card section-gap">
      <div class="card-title">Appearance</div>
      <div class="settings-row">
        <div><div class="settings-row-label">Theme</div></div>
        <div class="segctrl" id="theme-ctrl">
          ${[['dark','Dark'],['light','Light'],['hc','High contrast']].map(([t,l])=>`<button class="segbtn ${data.settings.theme===t?'active':''}" data-theme="${t}">${l}</button>`).join('')}
        </div>
      </div>
      <div class="settings-row">
        <div><div class="settings-row-label">Text size</div></div>
        <div class="segctrl" id="font-ctrl">
          ${[[0.9,'A'],[1,'A'],[1.15,'A'],[1.3,'A']].map(([v,l],i)=>`<button class="segbtn ${Math.abs((data.settings.fontScale||1)-v)<0.01?'active':''}" data-font="${v}" style="font-size:${12+i*2}px;">${l}</button>`).join('')}
        </div>
      </div>
      <div class="settings-row">
        <div><div class="settings-row-label">Motion</div><div class="settings-row-sub">Reduce animation throughout the app</div></div>
        <div class="segctrl" id="motion-ctrl">
          ${[['full','Full'],['reduced','Reduced']].map(([v,l])=>`<button class="segbtn ${data.settings.motion===v?'active':''}" data-motion="${v}">${l}</button>`).join('')}
        </div>
      </div>
      <div class="settings-row">
        <div><div class="settings-row-label">Daily reminder</div><div class="settings-row-sub">Uses your browser's notification permission</div></div>
        <div class="segctrl" id="reminder-ctrl">
          ${[['off','Off'],['on','On']].map(([v,l])=>`<button class="segbtn ${data.settings.reminder===v?'active':''}" data-reminder="${v}">${l}</button>`).join('')}
        </div>
      </div>
    </div>

    <div class="card section-gap">
      <div class="card-title">Install UNSENT</div>
      <p style="font-size:13px; color:var(--ink-2); margin:6px 0 14px; line-height:1.6;">Add UNSENT to your home screen so it opens like a regular app, and keeps working without a connection.</p>
      <button class="btn btn-ghost btn-sm" id="btn-install" ${window.__unsentInstallPrompt?'':'disabled style="opacity:.4"'}>Install app</button>
     <span id="install-hint" ...>${window.__unsentInstallPrompt ? '' : "If this isn't available, use your browser's 'Add to Home Screen' option."}</span>
    </div>

    <div class="card section-gap">
      <div class="card-title">Your entries belong to you.</div>
      <p style="font-size:13px; color:var(--ink-2); margin:6px 0 16px; line-height:1.6;">Your journal and reflections are stored locally in this browser only. UNSENT has no server and no account — nothing here is uploaded anywhere.</p>
      <div class="chip-row">
        <button class="btn btn-ghost btn-sm" id="btn-export">Export my data</button>
        <button class="btn btn-ghost btn-sm" id="btn-import">Import my data</button>
        <input type="file" id="import-file" accept="application/json" class="hidden">
      </div>
      <div class="divider"></div>
      <button class="btn btn-danger btn-sm" id="btn-delete-all">Delete everything</button>
    </div>

    <div class="card section-gap">
      <div class="card-title">Need more support?</div>
      <div class="safety-banner mt14" style="margin-top:14px;">
        <p style="font-size:13.5px; line-height:1.7;">UNSENT is a reflection tool, not a therapist, doctor, or emergency service.</p>
        <p style="font-size:13px; color:var(--ink-2); margin-top:10px; line-height:1.7;">If you're in the Philippines and need to talk to someone now: <strong>National Center for Mental Health Crisis Hotline</strong> — 1553 (landline, toll-free) or 0966-351-4518 / 0917-899-8727. In immediate danger, contact local emergency services (911) or go to the nearest emergency room. If you're elsewhere, please reach out to a local crisis line or a trusted person near you.</p>
      </div>
    </div>

    <div class="card section-gap">
      <div class="card-title">About UNSENT</div>
      <p style="font-size:13.5px; margin-top:8px; line-height:1.7;">UNSENT isn't about forgetting them. It's about making space for yourself again. It's a private space to say what you can't send, untangle what happened, pause before you act on impulse, and slowly return to yourself.</p>
    </div>
  `;
  document.getElementById('theme-ctrl').addEventListener('click', (e)=>{
    const b = e.target.closest('[data-theme]'); if(!b) return;
    data.settings.theme = b.dataset.theme; saveData(); applyTheme(); renderSettings(root);
  });
  document.getElementById('font-ctrl').addEventListener('click', (e)=>{
    const b = e.target.closest('[data-font]'); if(!b) return;
    data.settings.fontScale = parseFloat(b.dataset.font); saveData(); applyAccessibility(); renderSettings(root);
  });
  document.getElementById('motion-ctrl').addEventListener('click', (e)=>{
    const b = e.target.closest('[data-motion]'); if(!b) return;
    data.settings.motion = b.dataset.motion; saveData(); applyMotion(); renderSettings(root);
  });
  document.getElementById('reminder-ctrl').addEventListener('click', (e)=>{
    const b = e.target.closest('[data-reminder]'); if(!b) return;
    if(b.dataset.reminder==='on'){
      if(!('Notification' in window)){ toast('Notifications are not supported in this browser.'); return; }
      Notification.requestPermission().then(perm=>{
        if(perm==='granted'){
          data.settings.reminder='on'; saveData(); renderSettings(root);
          toast('Reminders on. UNSENT needs to be open to notify you — this is a browser limitation.');
          scheduleDailyReminder();
        } else {
          toast('Notification permission was not granted.');
        }
      });
    } else {
      data.settings.reminder='off'; saveData(); renderSettings(root);
    }
  });
  document.getElementById('pin-ctrl').addEventListener('click', (e)=>{
    const b = e.target.closest('[data-pin]'); if(!b) return;
    if(b.dataset.pin==='on'){
      showLockScreen('setup', ()=>{});
    } else {
      confirmDialog('Turn off passcode lock?', 'UNSENT will open without a code from now on, on this device.', 'Turn off', ()=>{
        data.security = {pinHash:null, enabled:false}; saveData(); toast('Passcode lock is off.'); renderSettings(root);
      }, true);
    }
  });
  const pinChangeBtn = document.getElementById('pin-change');
  if(pinChangeBtn) pinChangeBtn.addEventListener('click', ()=>showLockScreen('setup', ()=>{}));
  document.getElementById('btn-install').addEventListener('click', ()=>{
    if(window.__unsentInstallPrompt){
      window.__unsentInstallPrompt.prompt();
    }
  });
  document.getElementById('btn-export').addEventListener('click', exportData);
  document.getElementById('btn-import').addEventListener('click', ()=>document.getElementById('import-file').click());
  document.getElementById('import-file').addEventListener('change', importDataFile);
  document.getElementById('btn-delete-all').addEventListener('click', ()=>{
    confirmDialog('Delete everything?', 'This permanently deletes all your journal entries, unsent messages, reflections, and settings stored in this browser. This cannot be undone.', 'Delete everything', ()=>{
      confirmDialog('Are you absolutely sure?', 'There is no way to recover this data once it is deleted.', 'Yes, delete permanently', ()=>{
        localStorage.removeItem(STORAGE_KEY);
        data = defaultData();
        toast('Everything has been deleted.');
        document.getElementById('app').classList.remove('active');
        document.getElementById('screen-welcome').style.display='flex';
      }, true);
    }, true);
  });
}
function applyTheme(){ document.documentElement.setAttribute('data-theme', data.settings.theme||'dark'); }
function applyMotion(){ document.body.setAttribute('data-motion', data.settings.motion==='reduced'?'reduced':'full'); }
function applyAccessibility(){
  document.documentElement.style.setProperty('--font-scale', data.settings.fontScale || 1);
}
function scheduleDailyReminder(){
  if(data.settings.reminder!=='on' || !('Notification' in window) || Notification.permission!=='granted') return;
  setInterval(()=>{
    try{ new Notification('UNSENT', {body:"There's a quiet space here, whenever you need it."}); }catch(e){}
  }, 24*60*60*1000);
}

function exportData(){
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'unsent-export-'+todayStr()+'.json';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  toast('Exported.');
}
function importDataFile(e){
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const parsed = JSON.parse(reader.result);
      const base = defaultData();
      data = Object.assign({}, base, parsed);
      data.profile = Object.assign({}, base.profile, parsed.profile||{});
      data.reflections = Object.assign({}, base.reflections, parsed.reflections||{});
      data.dailyPrompt = Object.assign({}, base.dailyPrompt, parsed.dailyPrompt||{});
      data.settings = Object.assign({}, base.settings, parsed.settings||{});
      data.security = Object.assign({}, base.security, parsed.security||{});
      saveData(); applyTheme(); applyMotion(); applyAccessibility();
      toast('Data imported.');
      goPage('home');
    }catch(err){ toast('That file could not be read as UNSENT data.'); }
  };
  reader.readAsText(file);
  e.target.value = '';
}

/* ============================================================
   GLOBAL SEARCH
   ============================================================ */
function runGlobalSearch(q){
  q = q.trim().toLowerCase();
  if(!q) return {};
  const results = { Journal:[], 'Unsent messages':[], Memories:[], 'Timeline events':[] };
  data.journalEntries.forEach(e=>{ if((e.title||'').toLowerCase().includes(q)||(e.body||'').toLowerCase().includes(q)) results.Journal.push({label:e.title||'Untitled', sub:fmtDate(e.date), go:()=>{closeModal();goPage('journal');}}); });
  data.unsentMessages.forEach(m=>{ if((m.body||'').toLowerCase().includes(q)||(m.recipient||'').toLowerCase().includes(q)) results['Unsent messages'].push({label:m.recipient, sub:m.body.slice(0,50), go:()=>{closeModal();goPage('unload');setTimeout(()=>renderUnload(document.getElementById('page-root'),{view:'archive'}),50);}}); });
  data.memories.forEach(m=>{ if((m.title||'').toLowerCase().includes(q)||(m.description||'').toLowerCase().includes(q)) results.Memories.push({label:m.title, sub:fmtDate(m.date), go:()=>{closeModal();goPage('timeline');setTimeout(()=>renderTimeline(document.getElementById('page-root'),{view:'memories'}),50);}}); });
  data.timelineEvents.forEach(ev=>{ if((ev.label||'').toLowerCase().includes(q)) results['Timeline events'].push({label:ev.label, sub:fmtDate(ev.date), go:()=>{closeModal();goPage('timeline');setTimeout(()=>renderTimeline(document.getElementById('page-root'),{view:'events'}),50);}}); });
  return results;
}
function openSearch(){
  openModal(`
    <div class="modal-head"><h3 class="modal-title">Search</h3></div>
    <input type="text" id="global-search-input" placeholder="Search your journal, messages, memories..." autofocus>
    <div id="search-results" class="mt20" style="margin-top:20px;"></div>
  `);
  const input = document.getElementById('global-search-input');
  input.focus();
  input.addEventListener('input', ()=>{
    const results = runGlobalSearch(input.value);
    const resEl = document.getElementById('search-results');
    const groups = Object.entries(results).filter(([,arr])=>arr.length);
    if(!input.value.trim()){ resEl.innerHTML=''; return; }
    if(!groups.length){ resEl.innerHTML = `<p style="font-size:13px; color:var(--ink-3);">No results.</p>`; return; }
    resEl.innerHTML = groups.map(([g,arr])=>`
      <div class="subtle-label mt14" style="margin-top:14px;">${g}</div>
      <div class="entry-list">${arr.slice(0,5).map((r,i)=>`<div class="entry-item" data-sr="${g}-${i}"><div style="font-size:14px;">${escapeHtml(r.label)}</div><div class="entry-meta mt8" style="margin-top:4px;">${escapeHtml(r.sub)}</div></div>`).join('')}</div>
    `).join('');
    groups.forEach(([g,arr])=>arr.slice(0,5).forEach((r,i)=>{
      const el = document.querySelector(`[data-sr="${g}-${i}"]`);
      if(el) el.addEventListener('click', r.go);
    }));
  });
}
document.getElementById('btn-search').addEventListener('click', openSearch);

/* ============================================================
   ESCAPE HELPERS
   ============================================================ */
function escapeHtml(str){
  return String(str==null?'':str).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(str){ return escapeHtml(str); }

/* ============================================================
   AI-READY PLACEHOLDER
   ============================================================ */
function generateReflection(input, mode){
  // Local rule-based implementation. Can be swapped for an API call later.
  // mode: 'rewrite' | 'summary' | 'question'
  if(mode==='rewrite') return gentleRewrite(input);
  if(mode==='question') return "What would you need to know to feel more settled about this?";
  return "You're noticing a pattern. That noticing is itself progress, even when nothing else has changed yet.";
}

/* ============================================================
   PAGE REGISTRY
   ============================================================ */
Object.assign(PAGE_RENDERERS, {
  home: renderHome,
  unload: renderUnload,
  untangle: renderUntangle,
  pause: renderPause,
  reflect: renderReflect,
  timeline: renderTimeline,
  journal: renderJournalPage,
  community: renderCommunity,
  settings: renderSettings
});

/* ============================================================
   PWA: install prompt + service worker
   ============================================================ */
window.addEventListener('beforeinstallprompt', (e)=>{
  e.preventDefault();
  window.__unsentInstallPrompt = e;
});
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
  });
}

/* ============================================================
   INIT
   ============================================================ */
applyTheme();
applyMotion();
applyAccessibility();
if(data.settings.reminder==='on') scheduleDailyReminder();
if(data.profile.enteredBefore || data.profile.onboardingComplete){
  // returning user — still show welcome briefly, "Enter" skips onboarding
}

})();
