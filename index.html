<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UNSENT</title>
<meta name="theme-color" content="#0B0B0F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="UNSENT">
<link rel="manifest" id="manifest-link" href="">
<link rel="apple-touch-icon" id="apple-icon" href="">
<link rel="icon" id="fav-icon" href="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B0B0F; --bg1:#151519; --bg2:#1C1C22; --bg3:#26262D; --line:#2B2B33;
  --ink:#EDEDF2; --ink1:#B6B6C3; --ink2:#80808F; --violet:#9C8FE0; --glow:rgba(156,143,224,.16);
  --sage:#8FAE96; --clay:#CE9A73; --rose:#C98A9A;
  --serif:'Fraunces',Georgia,serif; --sans:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
}
:root[data-theme="light"]{
  --bg:#F6F4F1; --bg1:#FFFFFF; --bg2:#FBFAF8; --bg3:#EFEDE9; --line:#E2DFD9;
  --ink:#232026; --ink1:#5B5763; --ink2:#8B8794; --violet:#6E5FBE; --glow:rgba(110,95,190,.10);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.55;min-height:100vh;-webkit-font-smoothing:antialiased;
  padding-top:env(safe-area-inset-top,0px)}
h1,h2,h3{font-family:var(--serif);font-weight:500;letter-spacing:-.01em}
p{color:var(--ink1)}
button{font-family:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:2px solid var(--violet);outline-offset:2px;border-radius:6px}
.hidden{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;padding:12px 22px;border-radius:100px;border:1px solid transparent;font-size:14.5px;font-weight:600;transition:transform .15s,opacity .15s}
.btn:active{transform:scale(.97)}
.btn-main{background:var(--violet);color:#100D1C}
:root[data-theme="light"] .btn-main{color:#fff}
.btn-solid{background:var(--ink);color:var(--bg)}
.btn-ghost{background:none;border-color:var(--line);color:var(--ink1)}
.btn-ghost:hover{border-color:var(--ink2);color:var(--ink)}
.btn-danger{background:none;border-color:#5a3434;color:#d98080}
.btn-sm{padding:8px 15px;font-size:13px}
.btn[disabled]{opacity:.4;pointer-events:none}
.link{background:none;border:none;color:var(--ink2);font-size:14px;text-decoration:underline;text-underline-offset:4px}
.link:hover{color:var(--ink)}
.chip{padding:8px 14px;border-radius:100px;border:1px solid var(--line);background:var(--bg2);color:var(--ink1);font-size:13.5px}
.chip.on{background:var(--glow);border-color:var(--violet);color:var(--violet)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.seg{display:flex;background:var(--bg1);border:1px solid var(--line);border-radius:100px;padding:3px;margin-bottom:22px;width:fit-content;max-width:100%;overflow-x:auto}
.seg button{background:none;border:none;padding:8px 16px;border-radius:100px;font-size:13.5px;font-weight:500;color:var(--ink2);white-space:nowrap}
.seg button.on{background:var(--bg3);color:var(--ink)}
textarea,input[type=text],input[type=date]{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:12px;color:var(--ink);font:inherit;font-size:15px;padding:13px 14px;resize:vertical}
textarea:focus,input:focus{border-color:var(--violet);outline:none}
::placeholder{color:var(--ink2);opacity:.7}
label.lb{display:block;font-size:13px;color:var(--ink2);margin-bottom:8px}
.field{margin-bottom:18px}
input[type=range]{-webkit-appearance:none;width:100%;height:4px;border-radius:4px;background:var(--line);outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:var(--violet);border:3px solid var(--bg1);box-shadow:0 0 0 1px var(--violet)}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--violet);border:3px solid var(--bg1)}

/* layout */
.page{max-width:680px;margin:0 auto;padding:28px 20px calc(110px + env(safe-area-inset-bottom,0px))}
.page h1{font-size:clamp(26px,5vw,34px);margin-bottom:6px}
.sub{font-size:14.5px;color:var(--ink2);margin-bottom:24px}
.card{background:var(--bg1);border:1px solid var(--line);border-radius:18px;padding:22px}
.card+.card,.gap{margin-top:16px}
.card h3{font-size:18px;margin-bottom:6px}
.small{font-size:13px;color:var(--ink2)}
.note{font-size:13.5px;font-style:italic;color:var(--ink2)}
.item{background:var(--bg1);border:1px solid var(--line);border-radius:14px;padding:15px 16px;margin-top:10px;cursor:pointer}
.item:hover{border-color:var(--ink2)}
.item .meta{font-size:12px;color:var(--ink2);margin-bottom:5px;display:flex;justify-content:space-between;gap:8px}
.item .pv{font-size:14px;color:var(--ink1);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap}
.empty{text-align:center;color:var(--ink2);padding:36px 10px;font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.mt{margin-top:18px}

/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;background:var(--bg1);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;color:var(--ink2);font-size:11px;padding:7px 2px;border-radius:12px}
nav.tabs svg{width:22px;height:22px}
nav.tabs button.on{color:var(--violet)}
@media (min-width:860px){
  nav.tabs{top:0;right:auto;width:190px;flex-direction:column;justify-content:flex-start;gap:4px;padding:26px 12px;border-top:none;border-right:1px solid var(--line)}
  nav.tabs button{flex:none;flex-direction:row;gap:12px;font-size:14.5px;padding:12px;justify-content:flex-start}
  nav.tabs button.on{background:var(--glow)}
  #app .page{margin-left:max(190px,calc(50% - 340px + 95px));padding-bottom:60px}
}

/* welcome / lock */
.center{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px 24px}
.mark{font-family:var(--serif);font-size:clamp(52px,12vw,92px);line-height:1;letter-spacing:-.02em;animation:rise .9s both}
.tag{font-family:var(--serif);font-style:italic;color:var(--ink1);font-size:19px;margin-top:16px;animation:rise .9s .15s both}
.acts{display:flex;flex-direction:column;align-items:center;gap:16px;margin-top:40px;animation:rise .9s .3s both}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.foot{font-size:12px;color:var(--ink2);margin-top:44px;max-width:300px}
.dots{display:flex;gap:14px;justify-content:center;margin:24px 0}
.dots i{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--ink2)}
.dots i.f{background:var(--violet);border-color:var(--violet)}
.pad{display:grid;grid-template-columns:repeat(3,66px);gap:14px;justify-content:center}
.pad button{width:66px;height:66px;border-radius:50%;background:var(--bg2);border:1px solid var(--line);font:22px var(--serif)}
.pad button.g{background:none;border:none;color:var(--ink2);font-size:14px}

/* today */
.big{font-family:var(--serif);font-size:44px;margin:4px 0}
.hint{display:flex;justify-content:space-between;font-size:12px;color:var(--ink2);margin-top:8px}
.quick{display:grid;gap:10px}
.quick button{text-align:left;background:var(--bg1);border:1px solid var(--line);border-radius:14px;padding:16px 18px;font-size:15px}
.quick button small{display:block;color:var(--ink2);font-size:13px;margin-top:2px}
.quick button:hover{border-color:var(--violet)}

/* sort */
.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:640px){.cols{grid-template-columns:1fr}}
.col{background:var(--bg1);border:1px solid var(--line);border-radius:14px;padding:14px;min-height:120px}
.col h4{font-size:13px;margin-bottom:10px;font-weight:600}
.col.know h4{color:var(--sage)}.col.think h4{color:var(--clay)}.col.fear h4{color:var(--rose)}
.tile{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:9px 30px 9px 11px;font-size:13.5px;margin-bottom:8px;position:relative;cursor:pointer;color:var(--ink1)}
.tile b{position:absolute;right:9px;top:8px;font-weight:400;color:var(--ink2);cursor:pointer}

/* pause */
.orb{width:120px;height:120px;border-radius:50%;margin:30px auto;background:radial-gradient(circle at 35% 30%,var(--violet),#5B4F87);animation:br 8s ease-in-out infinite;box-shadow:0 0 50px var(--glow)}
@keyframes br{0%,100%{transform:scale(.72)}45%,55%{transform:scale(1)}}
.timer{font-family:var(--serif);font-size:40px;text-align:center}

/* modal / toast */
.back{position:fixed;inset:0;background:rgba(6,6,9,.66);z-index:200;display:flex;align-items:center;justify-content:center;padding:18px}
.modal{background:var(--bg1);border:1px solid var(--line);border-radius:22px;max-width:520px;width:100%;max-height:86vh;overflow-y:auto;padding:26px}
.modal h3{font-size:20px;margin-bottom:12px}
@media (max-width:700px){.back{align-items:flex-end;padding:0}.modal{border-radius:22px 22px 0 0}}
#toasts{position:fixed;bottom:96px;left:0;right:0;z-index:400;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 16px}
.toast{background:var(--ink);color:var(--bg);padding:11px 20px;border-radius:100px;font-size:13.5px;font-weight:500;animation:rise .3s both}
.step{display:flex;gap:14px;padding:11px 0;border-top:1px solid var(--line);font-size:14.5px;color:var(--ink1)}
.step:first-child{border-top:none}
.step i{font-family:var(--serif);color:var(--ink2);min-width:18px}
</style>
</head>
<body>

<!-- LOCK -->
<div id="lock" class="center hidden">
  <h2 id="lock-t" style="font-size:26px">Enter your passcode</h2>
  <p class="small" id="lock-s" style="margin-top:6px">Only you can open this.</p>
  <div class="dots" id="lock-dots"></div>
  <div class="pad" id="lock-pad"></div>
  <button class="link mt" id="lock-x">Cancel</button>
</div>

<!-- WELCOME -->
<div id="welcome" class="center">
  <div class="mark">UNSENT</div>
  <p class="tag">For the feelings that have nowhere to go.</p>
  <div class="acts">
    <button class="btn btn-solid" id="enter" style="padding:15px 34px;font-size:16px">Enter</button>
    <button class="link" id="w-install">Install as an app</button>
  </div>
  <p class="foot">Private to this device. Not a replacement for therapy, medical care, or emergency services.</p>
</div>

<!-- APP -->
<div id="app" class="hidden">
  <nav class="tabs" id="tabs" aria-label="Main"></nav>
  <main class="page" id="page"></main>
</div>
<div id="modal-root"></div>
<div id="toasts"></div>

<script>
(function(){
"use strict";
const $=(s,r)=>(r||document).querySelector(s), $$=(s,r)=>Array.from((r||document).querySelectorAll(s));
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function localDate(d){d=d||new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
const today=()=>localDate();
const fmt=d=>{const x=new Date(d+"T00:00:00");return isNaN(x)?d:x.toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"})};
const ago=d=>Math.round((new Date(today()+"T00:00:00")-new Date(d+"T00:00:00"))/864e5);

/* ---------- DATA ---------- */
const KEY="unsent2";
const blank=()=>({checkins:[],unsent:[],pauses:[],journal:[],letters:[],theme:null,pin:null});
function load(){
  try{
    const r=localStorage.getItem(KEY);
    if(r) return Object.assign(blank(),JSON.parse(r));
    const o=localStorage.getItem("unsentAppData"); // migrate from the older version
    if(o){
      const p=JSON.parse(o), d=blank();
      d.checkins=(p.checkIns||[]).map(c=>({date:c.date,weight:c.weight,reasons:c.reasons||[]}));
      d.unsent=(p.unsentMessages||[]).map(m=>({id:m.id,date:m.date,to:m.recipient,body:m.body,status:m.status==="released"?"released":"sealed"}));
      d.pauses=(p.pauseSessions||[]).map(m=>({id:m.id,date:m.date,kind:"text",resolved:m.resolved==="kept"?"kept":"done"}));
      d.journal=(p.journalEntries||[]).map(j=>({id:j.id,date:j.date,title:j.title,body:j.body}));
      d.letters=(p.futureLetters||[]).map(l=>({id:l.id,date:l.writtenDate,unlock:l.unlockDate,body:l.body}));
      d.pin=(p.security&&p.security.pinHash)||null;
      d.theme=(p.settings&&p.settings.theme==="light")?"light":"dark";
      return d;
    }
  }catch(e){}
  return blank();
}
let D=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){toast("Couldn’t save. Browser storage may be full.")}}
function toast(m){const e=document.createElement("div");e.className="toast";e.textContent=m;$("#toasts").appendChild(e);setTimeout(()=>{e.style.opacity="0";e.style.transition="opacity .4s";setTimeout(()=>e.remove(),400)},2400)}

/* ---------- MODAL ---------- */
function modal(html){
  closeModal();
  const b=document.createElement("div");b.className="back";b.id="modal";
  b.innerHTML='<div class="modal" role="dialog" aria-modal="true">'+html+'</div>';
  b.addEventListener("mousedown",e=>{if(e.target===b)closeModal()});
  $("#modal-root").appendChild(b);
  $$("[data-x]",b).forEach(x=>x.addEventListener("click",closeModal));
  return b;
}
function closeModal(){const m=$("#modal");if(m)m.remove()}
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});
function confirmBox(title,body,label,fn){
  const m=modal('<h3>'+title+'</h3><p>'+body+'</p><div class="row mt" style="justify-content:flex-end"><button class="btn btn-ghost" data-x>Cancel</button><button class="btn btn-danger" id="yes">'+label+'</button></div>');
  $("#yes",m).addEventListener("click",()=>{closeModal();fn()});
}
function seg(items,cur,k){return '<div class="seg">'+items.map(([v,l])=>'<button class="'+(v===cur?"on":"")+'" data-'+k+'="'+v+'">'+l+'</button>').join("")+'</div>'}
function chips(list,k,on){return '<div class="chips">'+list.map(o=>'<button type="button" class="chip'+(on&&on.includes(o)?" on":"")+'" data-'+k+'="'+esc(o)+'">'+o+'</button>').join("")+'</div>'}
function pick(root,k,multi){ // chip selection helper
  $$("[data-"+k+"]",root).forEach(b=>b.addEventListener("click",()=>{
    if(!multi)$$("[data-"+k+"]",root).forEach(x=>x.classList.remove("on"));
    b.classList.toggle("on",multi?!b.classList.contains("on"):true);
  }));
}
const chosen=(root,k)=>$$("[data-"+k+"].on",root).map(b=>b.dataset[k]);

/* ---------- ROUTER ---------- */
const ICON={
  today:'<path d="M3 11l9-8 9 8M5 10v10h14V10"/>',
  write:'<path d="M12 20h9M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/>',
  understand:'<circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01"/>',
  journal:'<path d="M4 4.5A2.5 2.5 0 016.5 2H20v17H6.5A2.5 2.5 0 004 16.5zM4 16.5A2.5 2.5 0 016.5 19H20"/>',
  settings:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/>'
};
const TABS=[["today","Today"],["write","Write"],["understand","Understand"],["journal","Journal"],["settings","Settings"]];
let cur="today";
const V={write:"unsent",und:"sort",jr:"entries"};
function go(p,sub){
  if(P.timer){clearInterval(P.timer);P.timer=null}
  if(P.stage==="timer"||P.stage==="decide"){finishPause("left")}
  P.stage="idle";
  if(sub){if(p==="write")V.write=sub;if(p==="understand")V.und=sub;if(p==="journal")V.jr=sub}
  cur=p;
  $("#tabs").innerHTML=TABS.map(([id,l])=>'<button class="'+(id===cur?"on":"")+'" data-go="'+id+'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+ICON[id]+'</svg><span>'+l+'</span></button>').join("");
  $$("#tabs [data-go]").forEach(b=>b.addEventListener("click",()=>go(b.dataset.go)));
  const el=$("#page");el.innerHTML="";
  ({today:rToday,write:rWrite,understand:rUnderstand,journal:rJournal,settings:rSettings})[p](el);
  window.scrollTo(0,0);
}
const rerender=()=>{const y=window.scrollY;go(cur);window.scrollTo(0,y)};

/* ---------- TODAY ---------- */
function rToday(el){
  const ci=D.checkins.find(c=>c.date===today()), w=ci?ci.weight:50, rs=ci?ci.reasons:[];
  const wk=x=>ago(x.date)<=6;
  const n1=D.unsent.filter(wk).length, n2=D.pauses.filter(wk).length, n3=D.journal.filter(wk).length;
  const bits=[];if(n1)bits.push("wrote "+n1+" unsent message"+(n1>1?"s":""));if(n2)bits.push("paused "+n2+" time"+(n2>1?"s":""));if(n3)bits.push("journaled "+n3+" time"+(n3>1?"s":""));
  const msg=v=>v<34?"A little more breathing room today.":v<67?"Today feels heavy. You don’t have to solve everything today.":"You don’t have to carry everything at once. Start with one thing.";
  el.innerHTML=`
    <h1>How are you carrying today?</h1>
    <p class="sub">${bits.length?"This week you "+bits.join(", ")+".":"Take a moment. No pressure."}</p>
    <div class="card">
      <h3>Check in</h3>
      <div class="big" id="wv">${w}%</div>
      <input type="range" min="0" max="100" value="${w}" id="ws" aria-label="How heavy today feels">
      <div class="hint"><span>Light</span><span>Very heavy</span></div>
      <p class="note mt" id="wm">${msg(w)}</p>
      <div class="mt" id="rs">${chips(["Missing them","A memory","Saw something online","Lonely","Angry","Nothing specific"],"r",rs)}</div>
      <button class="btn btn-main mt" id="ci">${ci?"Update check-in":"Save check-in"}</button>
    </div>
    <h3 style="margin:30px 0 12px;font-size:17px">Need something right now?</h3>
    <div class="quick">
      <button data-q="write:unsent">Get it out<small>Write what you can’t send</small></button>
      <button data-q="write:pause">I want to text them or check their profile<small>Wait it out before you decide</small></button>
      <button data-q="understand:sort">I can’t stop thinking about it<small>Sort what you know from what you fear</small></button>
    </div>`;
  const s=$("#ws");
  s.addEventListener("input",()=>{$("#wv").textContent=s.value+"%";$("#wm").textContent=msg(+s.value)});
  pick(el,"r",true);
  $("#ci").addEventListener("click",()=>{
    const e={date:today(),weight:+s.value,reasons:chosen(el,"r")};
    const i=D.checkins.findIndex(c=>c.date===today());
    if(i>-1)D.checkins[i]=e;else D.checkins.push(e);
    save();toast("Check-in saved.");rerender();
  });
  $$("[data-q]",el).forEach(b=>b.addEventListener("click",()=>{const [p,s]=b.dataset.q.split(":");go(p,s)}));
}

/* ---------- WRITE (unsent + pause) ---------- */
function rWrite(el){
  el.innerHTML=`<h1>Write</h1><p class="sub">Say everything. Send nothing. UNSENT can’t message anyone.</p>`+
    seg([["unsent","Unsent messages"],["pause","Pause"]],V.write,"v")+'<div id="wb"></div>';
  $$("[data-v]",el).forEach(b=>b.addEventListener("click",()=>{V.write=b.dataset.v;go("write")}));
  (V.write==="unsent"?wUnsent:wPause)($("#wb"));
}
function wUnsent(el){
  const list=D.unsent.slice().reverse();
  el.innerHTML=`
    <div class="card">
      <label class="lb">Who is this for?</label>
      ${chips(["My ex","Someone who hurt me","Someone I never told","Myself","Someone else"],"to")}
      <div class="field mt"><textarea id="ub" rows="8" placeholder="Start anywhere. No one will read this but you."></textarea></div>
      <div class="row">
        <button class="btn btn-main" id="seal">Seal it</button>
        <button class="btn btn-ghost" id="rel">Release it</button>
      </div>
      <p class="small mt">Seal keeps it here. Release marks it as let go. Both stay private.</p>
    </div>
    <h3 style="margin:30px 0 4px;font-size:17px">Your unsent messages (${list.length})</h3>

const P={stage:"idle",kind:"text",dur:300,rem:0,timer:null,id:null};
function finishPause(res){const s=D.pauses.find(x=>x.id===P.id);if(s&&s.resolved==="pending"){s.resolved=res;save()}}
function wPause(el){
  const mo=today().slice(0,7), m=D.pauses.filter(p=>p.date.slice(0,7)===mo), kept=m.filter(p=>p.resolved==="kept").length;
  if(P.stage==="idle"){
    el.innerHTML=`
      <div class="card">
        <h3>Feeling the urge?</h3>
        <p class="small" style="margin-bottom:16px">Give it a few minutes before you decide.</p>
        <label class="lb">What do you want to do?</label>
        ${chips(["Text them","Check their profile"],"k",["Text them"])}
        <div class="field mt"><label class="lb">What would you say? (optional)</label><textarea id="pt" rows="4" placeholder="Write it exactly as you would send it."></textarea></div>
        <label class="lb">How long to pause?</label>
        <div class="chips" id="pd">${[["5 min",300],["10 min",600],["30 min",1800]].map(([l,s])=>'<button type="button" class="chip'+(s===P.dur?" on":"")+'" data-d="'+s+'">'+l+'</button>').join("")}</div>
        <button class="btn btn-main mt" id="ps">Start pause</button>
      </div>
      ${m.length?`<p class="note mt">You paused ${m.length} time${m.length>1?"s":""} this month and chose not to act ${kept} time${kept===1?"":"s"}.</p>`:""}`;
    pick(el,"k",false);pick(el,"d",false);
    $$("[data-d]",el).forEach(b=>b.addEventListener("click",()=>{P.dur=+b.dataset.d}));
    $("#ps").addEventListener("click",()=>{
      P.kind=chosen(el,"k")[0]==="Check their profile"?"check":"text";
      P.rem=P.dur;P.stage="timer";P.id=uid();
      D.pauses.push({id:P.id,date:today(),kind:P.kind,resolved:"pending"});save();
      wPause(el);
    });
    return;
  }
  if(P.stage==="timer"){
    el.innerHTML=`<div class="card" style="text-align:center"><p class="note">You don’t have to decide yet.</p><div class="orb"></div><div class="timer" id="tn"></div><p class="small" id="bl" style="margin-top:6px"></p><button class="btn btn-ghost btn-sm mt" id="sk">Skip</button></div>`;
    const tick=()=>{
      const mm=Math.floor(P.rem/60),ss=P.rem%60;$("#tn").textContent=mm+":"+String(ss).padStart(2,"0");
      $("#bl").textContent=((P.dur-P.rem)%8)<4?"Breathe in":"Breathe out";
      if(P.rem<=0){clearInterval(P.timer);P.timer=null;P.stage="decide";wPause(el);return}
      P.rem--;
    };
    tick();P.timer=setInterval(tick,1000);
    $("#sk").addEventListener("click",()=>{clearInterval(P.timer);P.timer=null;P.stage="decide";wPause(el)});
    return;
  }
  if(P.stage==="decide"){
    el.innerHTML=`<div class="card" style="text-align:center"><h3>How do you feel now?</h3><p class="small">Whatever you choose, nothing is sent from here.</p>
      <div class="row mt" style="justify-content:center"><button class="btn btn-main" id="pk">The urge passed</button><button class="btn btn-ghost" id="pd2">I still want to</button></div></div>`;
    $("#pk").addEventListener("click",()=>{finishPause("kept");P.stage="idle";toast("Noted. That took something.");rerender()});
    $("#pd2").addEventListener("click",()=>{
      finishPause("done");P.stage="idle";
      modal('<h3>That’s your call</h3><p style="line-height:1.7">UNSENT can’t send anything for you. If you reach out, that happens outside this space. What you wrote here is only yours.</p><button class="btn btn-solid mt" data-x>Okay</button>');
      rerender();
    });
  }
}

/* ---------- UNDERSTAND (sort + miss) ---------- */
const S={know:[],think:[],fear:[],cat:"know"};
function rUnderstand(el){

function uSort(el){

  const total=S.know.length+S.think.length+S.fear.length;
  el.innerHTML=`

      <label class="lb">Type a thought, then pick where it belongs.</label>
      <input type="text" id="si" placeholder="e.g. They stopped replying on Tuesday">

      <p class="small mt">Tap a card to move it to the next column.</p>
    </div>

  $$("[data-c]",el).forEach(b=>b.addEventListener("click",()=>{S.cat=b.dataset.c;$$("[data-c]",el).forEach(x=>x.classList.toggle("on",x===b))}));
  const add=()=>{const v=$("#si").value.trim();if(!v)return;S[S.cat].push(v);uSort(el);$("#si").focus()};
  $("#sa").addEventListener("click",add);
  $("#si").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();add()}});
  $$(".tile",el).forEach(t=>t.addEventListener("click",e=>{
    const [c,i]=t.dataset.m.split(":");
    if(e.target.dataset.d){S[c].splice(+i,1);uSort(el);return}

function jPattern(el){
  const pts=D.checkins.filter(c=>ago(c.date)<=29).sort((a,b)=>a.date.localeCompare(b.date));
  let graph='<div class="empty">Check in a few times from Today and your pattern will show up here.</div>';
  if(pts.length>=2){
    const w=600,h=140,p=10,xs=pts.map((_,i)=>p+i*((w-2*p)/(pts.length-1))),ys=pts.map(c=>h-p-(c.weight/100)*(h-2*p));

    graph=`<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="width:100%;height:140px" role="img" aria-label="Emotional weight over the last 30 days"><path d="${path} L${xs[xs.length-1]},${h} L${xs[0]},${h}Z" fill="var(--glow)"/><path d="${path}" fill="none" stroke="var(--violet)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>${xs.map((x,i)=>'<circle cx="'+x.toFixed(1)+'" cy="'+ys[i].toFixed(1)+'" r="2.8" fill="var(--violet)"/>').join("")}</svg><div class="hint"><span>Last 30 days</span><span>Higher means heavier</span></div>`;

  $("#im").addEventListener("click",()=>$("#imf").click());
  $("#imf").addEventListener("change",e=>{
    const f=e.target.files[0];if(!f)return;const r=new FileReader();
    r.onload=()=>{try{const p=JSON.parse(r.result);D=Object.assign(blank(),p);save();theme();toast("Imported.");go("today")}catch(x){toast("That file isn’t UNSENT data.")}};
    r.readAsText(f);
  });
  $("#del").addEventListener("click",()=>confirmBox("Delete everything?","All entries, messages and settings on this device will be erased. This can’t be undone.","Delete everything",()=>{
    localStorage.removeItem(KEY);localStorage.removeItem("unsentAppData");D=blank();theme();
    $("#app").classList.add("hidden");$("#welcome").classList.remove("hidden");toast("Everything deleted.");
  }));
}
function theme(){
  const t=D.theme||(matchMedia("(prefers-color-scheme: light)").matches?"light":"dark");
  document.documentElement.setAttribute("data-theme",t);
  const m=document.querySelector('meta[name="theme-color"]');if(m)m.content=t==="light"?"#F6F4F1":"#0B0B0F";
}

/* ---------- LOCK ---------- */
async function sha(s){
  if(crypto&&crypto.subtle){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,"0")).join("")}
  return "f"+s.split("").reduce((h,c)=>(h<<5)-h+c.charCodeAt(0)|0,0);
}
let L={mode:"enter",buf:"",first:null,ok:null};
function lockOpen(mode,ok){L={mode,buf:"",first:null,ok};$("#lock").classList.remove("hidden");lockDraw()}
function lockDraw(){
  const t={enter:["Enter your passcode","Only you can open this."],setup:["Choose a passcode","4 digits. Something only you know."],confirm:["Confirm your passcode","Enter it once more."]}[L.mode];
  $("#lock-t").textContent=t[0];$("#lock-s").textContent=t[1];
  $("#lock-dots").innerHTML=[0,1,2,3].map(i=>'<i class="'+(i<L.buf.length?"f":"")+'"></i>').join("");
  $("#lock-pad").innerHTML=["1","2","3","4","5","6","7","8","9","","0","⌫"].map(k=>k===""?"<div></div>":'<button type="button" class="'+(k==="⌫"?"g":"")+'" data-k="'+k+'">'+k+"</button>").join("");
  $$("#lock-pad [data-k]").forEach(b=>b.addEventListener("click",()=>lockKey(b.dataset.k)));
}
async function lockKey(k){
  if(k==="⌫"){L.buf=L.buf.slice(0,-1);lockDraw();return}
  if(L.buf.length>=4)return;L.buf+=k;lockDraw();if(L.buf.length<4)return;
  const bad=()=>{$("#lock-s").textContent="That didn’t match. Try again.";setTimeout(()=>{L.buf="";lockDraw();$("#lock-s").textContent="Try again."},400)};
  if(L.mode==="enter"){if(await sha(L.buf)===D.pin){$("#lock").classList.add("hidden");L.ok&&L.ok()}else bad()}
  else if(L.mode==="setup"){L.first=L.buf;L.buf="";L.mode="confirm";lockDraw()}
  else{ if(L.buf===L.first){D.pin=await sha(L.buf);save();$("#lock").classList.add("hidden");toast("Passcode set.");L.ok&&L.ok()}else{L.mode="setup";L.first=null;bad()} }
}
$("#lock-x").addEventListener("click",()=>{
  $("#lock").classList.add("hidden");
  if(L.mode==="enter")$("#welcome").classList.remove("hidden");
});

/* ---------- START ---------- */
$("#enter").addEventListener("click",()=>{
  const open=()=>{$("#welcome").classList.add("hidden");$("#app").classList.remove("hidden");go("today")};
  if(D.pin)lockOpen("enter",open);else open();
});
$("#w-install").addEventListener("click",doInstall);
if(standalone())$("#w-install").classList.add("hidden");
if("serviceWorker" in navigator){
  window.addEventListener("load",()=>{navigator.serviceWorker.register("./sw.js").catch(()=>{})});
}
theme();
})();
</script>
